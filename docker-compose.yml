services:
   db:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - b_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
   redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - b_network
volumes:
  db_data:
   driver: local
networks:
  b_network:
   driver: bridge